name: npm Trusted Publishing Recovery

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to recover (must be 1.2.1)"
        required: true
        default: "1.2.1"

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 11.28.5

jobs:
  stage:
    name: Stage Package for Trusted Publishing
    runs-on: ubuntu-24.04
    environment: npm-production
    if: ${{ github.event.inputs.version == '1.2.1' }}

    steps:
      - name: Validate input version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "1.2.1" ]]; then
            echo "Invalid version: ${{ github.event.inputs.version }}. Must be 1.2.1."
            exit 1
          fi

      - name: Checkout tag ssh-mcp-pro-v1.2.1
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ssh-mcp-pro-v1.2.1

      - name: Verify version from tag
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [[ "$VERSION" != "1.2.1" ]]; then
            echo "Version mismatch: expected 1.2.1, got $VERSION"
            exit 1
          fi

      - name: Sync version files check
        run: node scripts/sync-version.mjs --check

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.3.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm run build

      - name: Pack package
        id: pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PACKAGE_FILE=$(
            pnpm pack --pack-destination artifacts --json |
              node -e "process.stdout.write(require('fs').readFileSync(0, 'utf8').trim())"
          )
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          sha256sum "artifacts/${PACKAGE_FILE}" > "artifacts/${PACKAGE_FILE}.sha256"

      - name: Publish to npm with trusted publishing (OIDC)
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          npm publish "./artifacts/${{ steps.pack.outputs.package_file }}" --access public --provenance

      - name: Verify npm package
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if published_version="$(pnpm view "ssh-mcp-pro@${VERSION}" version --silent 2>/dev/null)"; then
              if [[ "$published_version" == "$VERSION" ]]; then
                echo "Verified ssh-mcp-pro@${VERSION} on npm."
                exit 0
              fi
              echo "npm returned version '${published_version}', expected '${VERSION}'." >&2
            else
              echo "npm view did not find ssh-mcp-pro@${VERSION} on attempt ${attempt}." >&2
            fi
            if [[ "$attempt" == "18" ]]; then
              echo "ssh-mcp-pro@${VERSION} was not verifiable on npm after retries." >&2
              exit 1
            fi
            sleep 10
          done
