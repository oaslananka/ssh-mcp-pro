name: Recover v1.3.0 GitHub Release Assets

on:
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: recover-v130-release-assets
  cancel-in-progress: false

jobs:
  recover:
    name: Rebuild and verify immutable v1.3.0 assets
    if: github.repository == 'oaslananka/ssh-mcp-pro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RECOVERY_TAG: ssh-mcp-pro-v1.3.0
      RECOVERY_TAG_SHA: a7929197bcc367a9d47cd728b0d0c051a74ec097
      RECOVERY_SOURCE_SHA: f262e93c10465a96a002ee27c8dd77e69ad62dcb
      RECOVERY_RUN_ID: "41403107666"
      PNPM_VERSION: 11.28.9
    steps:
      - name: Checkout current main history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.3.0
          package-manager-cache: false

      - name: Checkout immutable v1.3.0 tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ssh-mcp-pro-v1.3.0
          path: release-source
          persist-credentials: false

      - name: Validate original release run and immutable source relationship
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RECOVERY_TAG}" --jq .sha)" = "$RECOVERY_TAG_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" --jq .head_sha)" = "$RECOVERY_SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" --jq .head_branch)" = main
          gh run view "$RECOVERY_RUN_ID" --json jobs --jq '
            [.jobs[] | select(.name == "Preflight release before publishing a tag" or .name == "Release Please") | .conclusion] |
            length == 2 and all(. == "success")
          ' | grep -qx true
          git cat-file -e "${RECOVERY_TAG_SHA}^{commit}"
          git cat-file -e "${RECOVERY_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$RECOVERY_TAG_SHA" "$RECOVERY_SOURCE_SHA"
          CHANGED="$(git diff --name-only "$RECOVERY_TAG_SHA" "$RECOVERY_SOURCE_SHA" | LC_ALL=C sort)"
          EXPECTED="$(printf '%s\n' scripts/check-dependency-freshness.mjs test/unit/dependency-freshness.test.ts | LC_ALL=C sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Download original preflight artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-preflight-artifacts
          run-id: 41403107666
          github-token: ${{ github.token }}
          path: preflight-artifacts

      - name: Verify artifact checksum and GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd preflight-artifacts
          sha256sum -c ssh-mcp-pro-1.3.0.tgz.sha256
          sha256sum -c sbom.cdx.json.sha256
          cd ..
          gh attestation verify preflight-artifacts/ssh-mcp-pro-1.3.0.tgz --repo "$GITHUB_REPOSITORY"

      - name: Rebuild from exact immutable tag
        working-directory: release-source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile --ignore-scripts
          mkdir -p artifacts ../rebuilt
          pnpm run sbom
          pnpm pack --pack-destination ../rebuilt > ../rebuilt-pack.log 2>&1
          PACKAGE_FILE="$(find ../rebuilt -maxdepth 1 -type f -name 'ssh-mcp-pro-1.3.0.tgz' -print -quit)"
          test -n "$PACKAGE_FILE"
          cmp "$PACKAGE_FILE" ../preflight-artifacts/ssh-mcp-pro-1.3.0.tgz
          node - artifacts/sbom.cdx.json ../preflight-artifacts/sbom.cdx.json <<'NODE'
          const fs = require("node:fs");
          const [rebuiltPath, attestedPath] = process.argv.slice(2);
          const rebuilt = JSON.parse(fs.readFileSync(rebuiltPath, "utf8"));
          const attested = JSON.parse(fs.readFileSync(attestedPath, "utf8"));
          delete rebuilt.serialNumber;
          delete attested.serialNumber;
          if (JSON.stringify(rebuilt) !== JSON.stringify(attested)) {
            throw new Error("Rebuilt SBOM content differs from the preflight-attested SBOM.");
          }
          NODE

      - name: Verify release is still empty and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 0
          gh release upload "$RECOVERY_TAG"             preflight-artifacts/ssh-mcp-pro-1.3.0.tgz             preflight-artifacts/ssh-mcp-pro-1.3.0.tgz.sha256             preflight-artifacts/sbom.cdx.json             preflight-artifacts/sbom.cdx.json.sha256             --repo "$GITHUB_REPOSITORY"
          gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e '
              [.assets[].name] as $names |
              ([
                "ssh-mcp-pro-1.3.0.tgz",
                "ssh-mcp-pro-1.3.0.tgz.sha256",
                "sbom.cdx.json",
                "sbom.cdx.json.sha256"
              ] | all(. as $asset | $names | index($asset) != null))
            ' >/dev/null
