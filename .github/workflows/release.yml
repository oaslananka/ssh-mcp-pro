name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 11.28.5

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release Please
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    name: Build, Publish, and Verify Release
    needs:
      - release
    if: >-
      ${{
        always() &&
        github.repository == 'oaslananka/ssh-mcp-pro' &&
        (
          (
            github.event_name != 'workflow_dispatch' &&
            needs.release.result == 'success' &&
            needs.release.outputs.release_created == 'true'
          ) ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-production
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout fixed recovery tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ssh-mcp-pro-v1.2.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.3.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify fixed recovery source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" != "1.2.1" ]]; then
            echo "Version mismatch: expected 1.2.1, got ${VERSION}" >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check

      - name: Pin npm for staged publishing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund --loglevel=error npm@11.21.0
          test "$(npm --version)" = "11.21.0"

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate dependency freshness report
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: freshness
        continue-on-error: true
        run: pnpm run check:freshness

      - name: Upload dependency freshness report
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-freshness-${{ needs.release.outputs.version }}
          path: artifacts/dependency-freshness.*
          if-no-files-found: warn

      - name: Fail on dependency freshness policy breach
        if: ${{ github.event_name != 'workflow_dispatch' && steps.freshness.outcome == 'failure' }}
        run: exit 1

      - name: Verify release quality
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: pnpm run check

      - name: Verify recovery package quality
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm run check:package

      - name: Build release assets
        id: pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm run sbom
          PACKAGE_FILE="$(
            pnpm pack --pack-destination artifacts --json |
              node scripts/extract-pack-filename.mjs
          )"
          sha256sum "artifacts/${PACKAGE_FILE}" > "artifacts/${PACKAGE_FILE}.sha256"
          sha256sum artifacts/sbom.cdx.json > artifacts/sbom.cdx.json.sha256
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Attest package artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}

      - name: Attest SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          sbom-path: artifacts/sbom.cdx.json
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}

      - name: Attach assets to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to npm with trusted publishing
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH == 'true' }}
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "./artifacts/${PACKAGE_FILE}" --access public --provenance

      - name: Verify npm package
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH == 'true' }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          for attempt in {1..18}; do
            if published_version="$(pnpm view "ssh-mcp-pro@${VERSION}" version --silent 2>npm-view.err)"; then
              if [[ "$published_version" == "$VERSION" ]]; then
                echo "Verified ssh-mcp-pro@${VERSION} on npm."
                exit 0
              fi
              echo "npm returned version '${published_version}', expected '${VERSION}'." >&2
            else
              echo "npm view did not find ssh-mcp-pro@${VERSION} on attempt ${attempt}." >&2
              if [[ -s npm-view.err ]]; then
                cat npm-view.err >&2
              fi
            fi

            if [[ "$attempt" == "18" ]]; then
              echo "ssh-mcp-pro@${VERSION} was not verifiable on npm after retries." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Record npm publish skip
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          echo "npm publishing is disabled by AUTO_RELEASE_PUBLISH."

      - name: Stage ssh-mcp-pro@1.2.1 with npm trusted publishing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm stage publish "./artifacts/${PACKAGE_FILE}" --access public --provenance

      - name: Record staged publishing handoff
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          {
            echo "### ssh-mcp-pro@1.2.1 staged for review"
            echo
            echo "The npm stage publish command completed successfully."
            echo "Review the staged package in npmjs.com → Staged Packages, then approve it with maintainer 2FA."
          } >> "${GITHUB_STEP_SUMMARY}"
