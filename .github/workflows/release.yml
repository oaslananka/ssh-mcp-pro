name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 11.28.5

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-preflight:
    name: Preflight release before publishing a tag
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      candidate: ${{ steps.detect.outputs.candidate }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Detect a version not yet released
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./.release-please-manifest.json')['.']")" = "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "ssh-mcp-pro-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
            echo "Preparing ssh-mcp-pro@${VERSION} before release creation."
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        with:
          node-version: 26.3.0
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Gate release on dependency freshness and full quality
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        run: |
          set -euo pipefail
          pnpm run check:freshness
          pnpm run check
      - name: Build package, SBOM and checksums before creating the release
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        id: pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm run sbom
          PACKAGE_FILE="$(pnpm pack --pack-destination artifacts --json | node scripts/extract-pack-filename.mjs)"
          (cd artifacts && sha256sum "${PACKAGE_FILE}" > "${PACKAGE_FILE}.sha256")
          (cd artifacts && sha256sum sbom.cdx.json > sbom.cdx.json.sha256)
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
      - name: Attest package before release creation
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}
      - name: Attest SBOM before release creation
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          sbom-path: artifacts/sbom.cdx.json
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}
      - name: Preserve verified release artifacts for publication
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-preflight-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: release-preflight
    name: Release Please
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name != 'workflow_dispatch' && needs.release-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    name: Attach verified GitHub Release assets
    needs: release
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download preflight-tested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-preflight-artifacts
          path: artifacts

      - name: Verify source, files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "ssh-mcp-pro-v${RELEASE_VERSION}"
          test -f "artifacts/ssh-mcp-pro-${RELEASE_VERSION}.tgz"
          (cd artifacts && sha256sum -c "ssh-mcp-pro-${RELEASE_VERSION}.tgz.sha256" && sha256sum -c sbom.cdx.json.sha256)
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" = "$GITHUB_SHA"

      - name: Upload and verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e --arg v "$RELEASE_VERSION" '
              [.assets[].name] as $names |
              (["ssh-mcp-pro-\($v).tgz", "ssh-mcp-pro-\($v).tgz.sha256", "sbom.cdx.json", "sbom.cdx.json.sha256"] | all(. as $asset | $names | index($asset) != null))
            ' >/dev/null

      - name: Trigger immutable-tag Docker publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref main -f "ref=${RELEASE_TAG}"

  publish-npm:
    name: Publish current GitHub Release to npm
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.3.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download and verify released artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="ssh-mcp-pro-v${VERSION}"
          FILE="ssh-mcp-pro-${VERSION}.tgz"
          test "$(node -p "require('./.release-please-manifest.json')['.']")" = "$VERSION"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          test "$(git show "${TAG_SHA}:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).version')" = "$VERSION"
          git merge-base --is-ancestor "$TAG_SHA" HEAD
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern "$FILE" --pattern "$FILE.sha256"
          (cd artifacts && sha256sum -c "${FILE}.sha256")
          test "$(tar -xOzf "artifacts/${FILE}" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).version')" = "$VERSION"
          gh attestation verify "artifacts/${FILE}" --repo "$GITHUB_REPOSITORY"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "file=$FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Check already-published version
        id: registry
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(npm view "ssh-mcp-pro@${VERSION}" version --silent 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "ssh-mcp-pro@${VERSION} is already public; no duplicate publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish directly to npm using GitHub OIDC
        if: ${{ steps.registry.outputs.already_published == 'false' }}
        env:
          FILE: ${{ steps.artifact.outputs.file }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "./artifacts/${FILE}" --access public --provenance --ignore-scripts

      - name: Verify public npm version
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if [[ "$(npm view "ssh-mcp-pro@${VERSION}" version --silent 2>/dev/null || true)" == "$VERSION" ]]; then
              echo "Verified ssh-mcp-pro@${VERSION} on public npm."
              exit 0
            fi
            echo "npm version ${VERSION} not visible (attempt ${attempt}/12)."
            sleep 10
          done
          echo "npm release ${VERSION} could not be verified." >&2
          exit 1

      - name: Trigger MCP Registry publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
        run: gh workflow run publish-mcp-registry.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f "ref=${RELEASE_TAG}"
