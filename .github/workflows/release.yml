name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: 11.28.5

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-preflight:
    name: Preflight release before publishing a tag
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      candidate: ${{ steps.detect.outputs.candidate }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Detect a version not yet released
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./.release-please-manifest.json')['.']")" = "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "ssh-mcp-pro-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
            echo "Preparing ssh-mcp-pro@${VERSION} before release creation."
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        with:
          node-version: 26.3.0
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Gate release on dependency freshness and full quality
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        run: |
          set -euo pipefail
          pnpm run check:freshness
          pnpm run check
      - name: Build package, SBOM and checksums before creating the release
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        id: pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm run sbom
          PACKAGE_FILE="$(pnpm pack --pack-destination artifacts --json | node scripts/extract-pack-filename.mjs)"
          sha256sum "artifacts/${PACKAGE_FILE}" > "artifacts/${PACKAGE_FILE}.sha256"
          sha256sum artifacts/sbom.cdx.json > artifacts/sbom.cdx.json.sha256
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
      - name: Attest package before release creation
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}
      - name: Attest SBOM before release creation
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          sbom-path: artifacts/sbom.cdx.json
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}
      - name: Preserve verified release artifacts for publication
        if: ${{ steps.detect.outputs.candidate == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-preflight-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: release-preflight
    name: Release Please
    if: ${{ github.repository == 'oaslananka/ssh-mcp-pro' && github.event_name != 'workflow_dispatch' && needs.release-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    name: Build, Publish, and Verify Release
    needs:
      - release
    if: >-
      ${{
        always() &&
        github.repository == 'oaslananka/ssh-mcp-pro' &&
        (
          (
            github.event_name != 'workflow_dispatch' &&
            needs.release.result == 'success' &&
            needs.release.outputs.release_created == 'true'
          ) ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-production
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout fixed recovery tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ssh-mcp-pro-v1.2.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.3.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify fixed recovery source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" != "1.2.1" ]]; then
            echo "Version mismatch: expected 1.2.1, got ${VERSION}" >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check

      - name: Enable pnpm
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Retrieve preflight-gated artifacts
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-preflight-artifacts
          path: artifacts

      - name: Verify recovered source package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm run check:package

      - name: Build recovery assets
        id: pack
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm run sbom
          PACKAGE_FILE="$(
            pnpm pack --pack-destination artifacts --json |
              node scripts/extract-pack-filename.mjs
          )"
          sha256sum "artifacts/${PACKAGE_FILE}" > "artifacts/${PACKAGE_FILE}.sha256"
          sha256sum artifacts/sbom.cdx.json > artifacts/sbom.cdx.json.sha256
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Attest recovery package artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}

      - name: Attest recovery SBOM
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          sbom-path: artifacts/sbom.cdx.json
          subject-path: artifacts/${{ steps.pack.outputs.package_file }}

      - name: Verify release source, files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || 'ssh-mcp-pro-v1.2.1' }}
          RELEASE_VERSION: ${{ needs.release.outputs.version || '1.2.1' }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test -f "artifacts/ssh-mcp-pro-${RELEASE_VERSION}.tgz"
          (cd artifacts && sha256sum -c "ssh-mcp-pro-${RELEASE_VERSION}.tgz.sha256" && sha256sum -c sbom.cdx.json.sha256)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$(git rev-parse HEAD)" = '0180a3961a8b105aa8003c93da1f3af93769a211'
          else
            test "$RELEASE_TAG" = "ssh-mcp-pro-v${RELEASE_VERSION}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)" = "$GITHUB_SHA"
          fi

      - name: Attach checked assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || 'ssh-mcp-pro-v1.2.1' }}
          RELEASE_VERSION: ${{ needs.release.outputs.version || '1.2.1' }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e --arg v "$RELEASE_VERSION" '
              [.assets[].name] as $names |
              (["ssh-mcp-pro-\($v).tgz", "ssh-mcp-pro-\($v).tgz.sha256", "sbom.cdx.json", "sbom.cdx.json.sha256"] | all(. as $asset | $names | index($asset) != null))
            ' >/dev/null

      - name: Publish to npm with trusted publishing
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH == 'true' }}
        env:
          PACKAGE_FILE: ssh-mcp-pro-${{ needs.release.outputs.version }}.tgz
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "./artifacts/${PACKAGE_FILE}" --access public --provenance

      - name: Verify npm package
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH == 'true' }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          for attempt in {1..18}; do
            if published_version="$(npm view "ssh-mcp-pro@${VERSION}" version --silent 2>npm-view.err)"; then
              if [[ "$published_version" == "$VERSION" ]]; then
                echo "Verified ssh-mcp-pro@${VERSION} on npm."
                exit 0
              fi
              echo "npm returned version '${published_version}', expected '${VERSION}'." >&2
            else
              echo "npm view did not find ssh-mcp-pro@${VERSION} on attempt ${attempt}." >&2
              if [[ -s npm-view.err ]]; then
                cat npm-view.err >&2
              fi
            fi

            if [[ "$attempt" == "18" ]]; then
              echo "ssh-mcp-pro@${VERSION} was not verifiable on npm after retries." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Record npm publish skip
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          echo "npm publishing is disabled by AUTO_RELEASE_PUBLISH."

      - name: Record fixed 1.2.1 asset-only recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Restored v1.2.1 release assets only; npm stage a083f086-af6e-459b-8e4c-75e9719e6653 remains pending maintainer 2FA.' >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger immutable-tag GHCR publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || 'ssh-mcp-pro-v1.2.1' }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref main -f "ref=${RELEASE_TAG}"

      - name: Trigger MCP registry publication after verified npm publish
        if: ${{ github.event_name != 'workflow_dispatch' && vars.AUTO_RELEASE_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh workflow run publish-mcp-registry.yml --repo "$GITHUB_REPOSITORY" --ref main -f 'dry_run=false' -f "ref=${RELEASE_TAG}"
