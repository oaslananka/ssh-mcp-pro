merge_queue:
  mode: serial
  max_parallel_checks: 1
  status_comments: outcomes
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    max_checks_retries: 0
    checks_timeout: 90 min
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -closed
      - -label = do-not-merge
      - -label = hold
      - -label = automerge:disabled
pull_request_rules:
  - name: Queue eligible Renovate updates
    conditions:
      - author = renovate[bot]
      - base = main
      - label = automerge:enabled
      - -draft
      - -closed
      - -label = automerge:disabled
      - -label = do-not-merge
      - -label = hold
      - -label = requires-review
      - -label = status/needs-review
      - -label = risk:high
      - -label = runtime-risk
      - -label = needs:decision
      - -label = security
      - -label = type:security
      - '-files ~= ^\.github/'
      - '-files ~= ^Dockerfile$'
      - '-files ~= (^|/)docker-compose(?:\.[^.]+)?\.ya?ml$'
      - '-files ~= ^\.mergify\.ya?ml$'
    actions:
      queue:
        name: default
